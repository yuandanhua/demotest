<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜数字小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        input[type="number"] {
            width: 150px;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="number"]:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .btn {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }

        #submitBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #submitBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        #submitBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #restartBtn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            display: none;
        }

        #restartBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.4);
        }

        .message {
            margin: 25px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message.too-high {
            background-color: #fff3cd;
            color: #856404;
        }

        .message.too-low {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .message.correct {
            background-color: #d4edda;
            color: #155724;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .message.default {
            background-color: #f8f9fa;
            color: #6c757d;
        }

        .stats {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 14px;
        }

        .stats strong {
            color: #667eea;
            font-size: 24px;
        }

        /* 移动端响应式布局 */
        @media (max-width: 768px) {
            .game-container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 12px;
            }

            input[type="number"] {
                width: 100%;
                max-width: 200px;
                font-size: 16px;
            }

            .btn {
                width: 100%;
                padding: 12px;
            }

            .message {
                font-size: 16px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 猜数字小游戏</h1>
        <p class="subtitle">猜一个 1 到 100 之间的整数</p>

        <div class="input-section">
            <input type="number" id="guessInput" min="1" max="100" placeholder="输入数字">
            <br>
            <button id="submitBtn" class="btn">提交猜测</button>
            <button id="restartBtn" class="btn">再来一局</button>
        </div>

        <div id="message" class="message default">
            请输入 1-100 之间的数字开始游戏
        </div>

        <div class="stats">
            猜测次数：<strong id="guessCount">0</strong>
        </div>
    </div>

    <script>
        // 游戏状态
        let targetNumber;
        let guessCount = 0;
        let isGameOver = false;

        // DOM 元素
        const guessInput = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const restartBtn = document.getElementById('restartBtn');
        const messageEl = document.getElementById('message');
        const guessCountEl = document.getElementById('guessCount');

        // 初始化游戏
        function initGame() {
            // AC2: 使用 Math.random() 生成 1-100 之间的随机整数
            targetNumber = Math.floor(Math.random() * 100) + 1;
            guessCount = 0;
            isGameOver = false;

            // 重置 UI
            guessInput.value = '';
            guessInput.disabled = false;
            submitBtn.disabled = false;
            restartBtn.style.display = 'none';
            messageEl.textContent = '请输入 1-100 之间的数字开始游戏';
            messageEl.className = 'message default';
            guessCountEl.textContent = '0';

            // 聚焦输入框
            guessInput.focus();

            console.log('目标数字（调试用）:', targetNumber);
        }

        // 验证输入
        function validateInput(value) {
            const num = Number(value);

            if (value === '' || isNaN(num)) {
                return { valid: false, message: '请输入一个有效的数字' };
            }

            if (num < 1 || num > 100) {
                return { valid: false, message: '请输入 1-100 之间的整数' };
            }

            if (!Number.isInteger(num)) {
                return { valid: false, message: '请输入整数，不要输入小数' };
            }

            return { valid: true, value: num };
        }

        // 处理猜测
        function makeGuess() {
            if (isGameOver) return;

            const input = guessInput.value;
            const validation = validateInput(input);

            if (!validation.valid) {
                messageEl.textContent = validation.message;
                messageEl.className = 'message error';
                return;
            }

            const guess = validation.value;
            guessCount++;
            guessCountEl.textContent = guessCount;

            // AC3: 比较并显示提示
            if (guess > targetNumber) {
                messageEl.textContent = `📈 ${guess} 猜大了！再试一次`;
                messageEl.className = 'message tooo-high';
            } else if (guess < targetNumber) {
                messageEl.textContent = `📉 ${guess} 猜小了！再试一次`;
                messageEl.className = 'message too-low';
            } else {
                // AC4: 猜对了
                messageEl.textContent = `🎉 恭喜通关！答案就是 ${guess}！你用了 ${guessCount} 次猜中。`;
                messageEl.className = 'message correct';
                guessInput.disabled = true;
                submitBtn.disabled = true;
                isGameOver = true;

                // AC5: 显示"再来一局"按钮
                restartBtn.style.display = 'inline-block';
            }

            // 清空输入框并聚焦
            if (!isGameOver) {
                guessInput.value = '';
                guessInput.focus();
            }
        }

        // AC5: 重置游戏
        function restartGame() {
            initGame();
        }

        // 事件监听
        submitBtn.addEventListener('click', makeGuess);
        restartBtn.addEventListener('click', restartGame);

        // 回车键提交
        guessInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                makeGuess();
            }
        });

        // 页面加载时初始化游戏
        initGame();
    </script>
</body>
</html>
